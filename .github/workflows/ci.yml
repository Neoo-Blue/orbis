name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        # The concurrency in the flow tracker is where the real bugs live, so
        # the race detector is not optional here.
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  release-build:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build the UI
        run: cd web && npm ci && npm run build

      - name: Build the daemon
        # A single static binary with the UI embedded is the whole deployment
        # story; this job proves that still holds on every push.
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o orbisd ./cmd/orbisd
          ./orbisd -version
          ls -lh orbisd

      - uses: actions/upload-artifact@v4
        with:
          name: orbisd-linux-amd64
          path: orbisd
          retention-days: 14
